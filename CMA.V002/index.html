<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SF ServiceFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f4f7fc',
                100: '#e5edfa',
                500: '#3b82f6',
                600: '#2563eb',
                900: '#0B1F4B'
              }
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .btn-primary {
          @apply font-medium h-11 px-6 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-95;
          background: linear-gradient(135deg, #1a6bff 0%, #2979ff 100%);
          box-shadow: 0 4px 20px rgba(26,107,255,.3);
          border: none;
          color: #fff;
        }
        .btn-secondary {
          @apply font-medium h-11 px-6 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 active:scale-95;
          background: rgba(255,255,255,.06);
          border: 1px solid rgba(255,255,255,.12);
          color: #f0f4ff;
        }
        .btn-ghost {
          @apply bg-transparent font-medium h-11 px-6 rounded-xl transition-all flex items-center justify-center gap-2 active:scale-95;
          color: #00d4ff;
        }
        .btn-danger {
          @apply font-medium h-11 px-6 rounded-xl transition-all flex items-center justify-center gap-2 active:scale-95;
          background: rgba(239,68,68,.1);
          border: 1px solid rgba(239,68,68,.3);
          color: #ef4444;
        }
        .card {
          @apply p-4 sm:p-6 rounded-xl;
          background: rgba(255,255,255,.03);
          border: 1px solid rgba(255,255,255,.07);
          color: #f0f4ff;
        }
        .input-field {
          @apply w-full h-11 px-4 rounded-xl outline-none transition-all;
          background: rgba(255,255,255,.05);
          border: 1px solid rgba(255,255,255,.12);
          color: #f0f4ff;
        }
        .input-field:focus {
          background: rgba(26,107,255,.08);
          border-color: rgba(26,107,255,.6);
          box-shadow: 0 0 0 3px rgba(26,107,255,.1);
        }
        .input-field::placeholder {
          color: #4a5568;
        }
      }
    </style>
    <style>
      /* Base: dark background, DM Sans como fonte padrão do app */
      html, body {
        background-color: #0a0f1e;
        font-family: 'DM Sans', 'Inter', sans-serif;
        color: #f0f4ff;
      }
      /* Select option dropdown bg */
      select.input-field option,
      .sf-app select option {
        background: #141d35;
        color: #f0f4ff;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "date-fns": "https://esm.sh/date-fns@3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0",
    "recharts": "https://esm.sh/recharts@2.12.7?deps=react@18.2.0,react-dom@18.2.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
